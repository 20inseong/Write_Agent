{% extends "base.html" %}

{% block title %}소설 블록 세팅 · 글쓰기 에이전트{% endblock %}

{% block content %}
<main class="mx-auto min-h-screen max-w-3xl px-4 py-10">
  <header class="mb-8">
    <a href="{% url 'dashboard' %}" class="text-sm text-indigo-600 hover:text-indigo-800">← 작업실로</a>
    <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-800">소설 블록 세팅</h1>
    <p class="mt-2 text-sm text-slate-500">장면별 목표와 키워드를 블록 단위로 구성하세요.</p>
  </header>

  <form id="editor-setup-form" method="post" action="{% url 'editor' %}">
    {% csrf_token %}

    <div id="blocks-container" class="space-y-4">
      {% include "block_partial.html" with block_index=initial_block_index %}
    </div>
  
    <div class="mt-6">
      <button
        type="button"
        id="add-block-btn"
        hx-get="{% url 'add_block' %}?index=2"
        hx-target="#blocks-container"
        hx-swap="beforeend"
        class="w-full rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 px-4 py-3 text-sm font-medium text-slate-600 transition hover:border-indigo-400 hover:bg-indigo-50 hover:text-indigo-700"
      >
        + 블록 추가
      </button>
    </div>
  
    <footer class="mt-10 border-t border-slate-200 pt-8">
      <button
        type="submit"
        class="inline-flex w-full items-center justify-center rounded-xl bg-indigo-600 px-6 py-4 text-base font-semibold text-white shadow-md transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        AI 초안 생성 시작
      </button>
    </footer>
  </form>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
  document.body.addEventListener("htmx:afterSwap", function (event) {
    if (event.detail.target.id !== "blocks-container") {
      return;
    }
    const btn = document.getElementById("add-block-btn");
    const blocks = document.querySelectorAll("#blocks-container [data-block-index]");
    const nextIndex = blocks.length + 1;
    const baseUrl = "{% url 'add_block' %}";
    btn.setAttribute("hx-get", baseUrl + "?index=" + nextIndex);
    htmx.process(btn);
  });

  function updateBlockNumbers() {
    // 화면에 남은 모든 블록을 가져옴
    const blocks = document.querySelectorAll('.input-block'); 
    
    blocks.forEach((block, index) => {
        const actualNumber = index + 1;
        
        // 블록 제목 텍스트 수정
        const titleLabel = block.querySelector('.block-title'); 
        if (titleLabel) {
            titleLabel.textContent = `입력 블록 #${actualNumber}`;
        }

        // name 속성 숫자 업데이트
        const inputs = block.querySelectorAll('input:not([type="hidden"]), textarea');
        inputs.forEach(input => {
            const oldName = input.getAttribute('name');
            if (oldName) {
                // 맨 뒤의 '_' 이후의 숫자를 잘라내고 새 번호 붙이기
                const baseName = oldName.substring(0, oldName.lastIndexOf('_'));
                input.setAttribute('name', `${baseName}_${actualNumber}`);
            }

            // id 속성 숫자도 업데이트
            const oldId = input.getAttribute('id');
            if (oldId) {
                const baseId = oldId.substring(0, oldId.lastIndexOf('-'));
                const newId = `${baseId}-${actualNumber}`;
                input.setAttribute('id', newId);
                
                // label의 for 속성도 같이 업데이트 (id와 짝꿍이므로)
                const label = block.querySelector(`label[for="${oldId}"]`);
                if (label) {
                    label.setAttribute('for', newId);
                }
            }
        });
    });

    // '+ 블록 추가' 버튼의 다음 HTMX 호출 번호 업데이트
    const addBtn = document.getElementById('add-block-btn'); // 🌟 이 ID가 맞는지 확인 필요!
    if (addBtn) {
        const nextIndex = blocks.length + 1;
        // hx-get의 URL을 새로 계산된 번호로 덮어씌운다.
        addBtn.setAttribute('hx-get', `{% url 'add_block' %}?index=${nextIndex}`);
        htmx.process(addBtn); 
    }
}

// HTMX로 새 블록이 '추가'되었을 때도 꼬이지 않게 함수 한 번 실행
document.body.addEventListener('htmx:afterSettle', function(event) {
    updateBlockNumbers();
});

document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById('editor-setup-form');

    if (!form) return;

    const submitBtn = form.querySelector('button[type="submit"]');
    const originalBtnText = "AI 초안 생성 시작";

    // TIP text 생성
    let tipText = document.getElementById('ai-tip-text');
    if (!tipText) {
        tipText = document.createElement('p');
        tipText.id = 'ai-tip-text';
        // animation 적용
        tipText.className = 'mb-4 text-sm font-bold text-indigo-500 text-center transition-all duration-300 opacity-0 h-0 overflow-hidden';
        tipText.innerText = '💡 팁: 빈칸을 모두 구체적으로 채우면 AI가 훨씬 정교한 초안을 완성합니다.';
        submitBtn.parentNode.insertBefore(tipText, submitBtn);
    }

    // 주소창에서 mode 꼬리표 확인 (?mode=random)
    const urlParams = new URLSearchParams(window.location.search);
    const isRandomMode = urlParams.get('mode') === 'random';

    // 랜덤 모드라면 검사 없이 통과
    if (isRandomMode) {
      submitBtn.disabled = false;
      submitBtn.innerText = originalBtnText;
      return; 
    }

    // 세계관 블록 모드일 때 빈칸 검사 로직
    function checkInputs() {
      // 폼 안의 모든 텍스트 입력칸 찾기(숫자 제외)
      const inputs = form.querySelectorAll('input:not([type="hidden"]):not([type="number"]), textarea');
      
      let filledCount = 0;
      let totalCount = 0;

      // 전체 입력칸 개수와 채워진 입력칸 개수 세기
      inputs.forEach(input => {
        totalCount++;
        if (input.value.trim() !== '') {
            filledCount++;
        }
      });

      // 조건에 따른 UI 업데이트
      if (filledCount === 0) {
        // [상태 A] 완전 빈칸: 버튼 잠금 & 팁 숨기기
        submitBtn.disabled = true;
        submitBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed', 'bg-slate-400');
        submitBtn.innerText = '블록 내용을 입력해주세요 🔒';
        
        tipText.classList.remove('opacity-100', 'h-5');
        tipText.classList.add('opacity-0', 'h-0');

      } else if (filledCount > 0 && filledCount < totalCount) {
        // [상태 B] 일부만 채움: 버튼 활성화 & 팁 보여주기 💡
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-400');
        submitBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
        submitBtn.innerText = originalBtnText;
        
        tipText.classList.remove('opacity-0', 'h-0');
        tipText.classList.add('opacity-100', 'h-5'); // 팁 스르륵 등장

      } else if (filledCount === totalCount) {
        // [상태 C] 전부 채움: 버튼 활성화 & 팁 숨기기 (완벽하니까!)
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-400');
        submitBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
        submitBtn.innerText = originalBtnText;
        
        tipText.classList.remove('opacity-100', 'h-5');
        tipText.classList.add('opacity-0', 'h-0'); // 팁 스르륵 퇴장
      }
    }

    // 블록 삭제/추가 완벽 감지
    const blocksContainer = document.getElementById('blocks-container');
    if (blocksContainer) {
        const observer = new MutationObserver(function(mutations) {
            checkInputs(); // 블록이 날아가는 즉시 검사 재실행!
        });
        observer.observe(blocksContainer, { childList: true, subtree: true });
    }

    // 화면이 처음 켜졌을 때 초기 검사
    checkInputs();

    form.addEventListener('input', checkInputs);
  });

</script>
{% endblock %}
