{% extends "base.html" %}

{% block title %}프로젝트 설정 · {{ novel.title }} · 글쓰기 에이전트{% endblock %}

{% block content %}
<div class="flex h-[calc(100vh-3.5rem)] bg-slate-50 relative">
  <div class="flex-1 flex flex-col h-full w-full">
    
    <!-- 상단 바 -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-20">
      <div class="flex items-center gap-4">
        <!-- 뒤로 가기 (2단계 카테고리 화면으로 이동) -->
        <a href="{% url 'world_category' novel.id %}" class="text-slate-400 hover:text-indigo-600 transition p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <nav class="text-sm font-semibold flex items-center gap-2">
          <a href="{% url 'world_list' %}" class="text-slate-400 hover:text-slate-800 transition">내 프로젝트</a>
          <span class="text-slate-300">/</span>
          <a href="{% url 'world_category' novel.id %}" class="text-slate-400 hover:text-slate-800 transition">{{ novel.title }}</a>
          <span class="text-slate-300">/</span>
          <span class="text-indigo-700 font-bold">프로젝트 설정</span>
        </nav>
      </div>
    </header>

    <!-- 중앙 메인 폼 영역 -->
    <main class="flex-1 overflow-y-auto p-8 md:p-12 lg:px-32 flex justify-center">
      <form method="POST" class="w-full max-w-3xl bg-white p-10 rounded-2xl shadow-sm border border-slate-200 h-fit">
        {% csrf_token %}
        
        <div class="border-b border-slate-100 pb-6 mb-8">
          <h1 class="text-2xl font-extrabold text-slate-900">프로젝트 정보 수정</h1>
          <p class="text-sm text-slate-500 mt-1">소설의 기본 제목과 로그라인(작품 소개)을 변경할 수 있습니다.</p>
        </div>

        <div class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">소설 제목</label>
            <input type="text" name="title" value="{{ novel.title }}" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-800 font-medium">
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">작품 소개 및 로그라인</label>
            <textarea name="description" rows="6" placeholder="소설의 전체적인 줄거나 핵심 설정을 요약해 보세요." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-800 leading-relaxed">{{ novel.description }}</textarea>
          </div>
        </div>

        <div class="mt-8 flex justify-end gap-3 pt-6 border-t border-slate-100">
          <a href="{% url 'world_category' novel.id %}" class="px-5 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition font-bold">취소</a>
          <button type="submit" class="px-6 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition font-bold shadow-md">저장하기</button>
        </div>
      </form>
    </main>

  </div>
</div>
{% endblock %}
