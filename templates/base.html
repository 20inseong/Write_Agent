{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}글쓰기 에이전트{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'home' %}{% endif %}" class="text-sm font-semibold text-slate-800 hover:text-indigo-600">
        글쓰기 에이전트
      </a>
      <div class="flex items-center gap-3">
        <button type="button" 
                hx-get="{% url 'notice_modal' %}" 
                hx-target="body" 
                hx-swap="beforeend"
                class="text-slate-500 hover:text-indigo-600 focus:outline-none flex items-center justify-center p-2 rounded-full hover:bg-slate-100 transition cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0M3.124 7.5A8.969 8.969 0 0 1 5.292 3m13.416 0a8.969 8.969 0 0 1 2.168 4.5" />
          </svg>
        </button>
        {% if user.is_authenticated %}
          <span class="hidden text-sm text-slate-500 sm:inline">{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" class="inline">
            {% csrf_token %}
            <button
              type="submit"
              class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
              로그아웃
            </button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600">로그인</a>
          <a href="{% url 'signup' %}" class="rounded-lg bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white transition hover:bg-indigo-700">회원가입</a>
        {% endif %}
      </div>
    </nav>
  </header>

  {% block content %}{% endblock %}
  <script src="{% static 'js/common/utils.js' %}"></script>
  <script src="{% static 'js/common/ui.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
