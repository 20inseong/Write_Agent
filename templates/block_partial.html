<div
  class="input-block rounded-xl border border-slate-200 bg-white p-5 shadow-sm relative"
  data-block-index="{{ block_index }}"
>

<!-- 2. 오른쪽 위 구석에 달리는 X 버튼 -->
<button type="button" 
        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 font-bold text-4xl leading-none px-3 py-2 z-10 cursor-pointer"
        onclick="this.closest('.input-block').remove()">
        &times;
      </button>

  <div class="mb-3 flex items-center justify-between">
    <span class="text-sm font-semibold text-slate-600">입력 블록 #{{ block_index }}</span>
  </div>
  <div class="space-y-4">
    <div>
      <label for="goal-chars-{{ block_index }}" class="mb-1 block text-sm font-medium text-slate-700">
        목표 글자 수
      </label>
      <input
        type="number"
        id="goal-chars-{{ block_index }}"
        name="goal_chars_{{ block_index }}"
        min="1"
        placeholder="예: 3000"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      >
    </div>
    <div>
      <label for="characters-{{ block_index }}" class="mb-1 block text-sm font-medium text-slate-700">
        상황 키워드
      </label>
      <input
        type="text"
        id="characters-{{ block_index }}"
        name="characters_{{ block_index }}"
        placeholder="예: 감탄, 고통, 사건 발생"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      >
    </div>
    <!--블록 내용이라는 틀 안에 시작점, 상황, 절정, 다음 블록 연결을 입력할 수 있는 텍스트 구현하기 -->
    <div>
      <label class="mt-8 mb-1 block text-sm font-medium text-slate-700">
        블록 내용
      </label>
      <div class="mt-6 border border-gray-200 bg-gray-50 p-5 rounded-md">
        <label class="block text-sm font-semibold text-gray-600">시작점</label>
        <textarea name="start_{{ block_index }}" rows="2" class="w-full border p-2 rounded mt-1" placeholder="이 블록의 시작점을 입력하세요."></textarea>

        <label class="block text-sm font-semibold text-gray-600">상황</label>
        <textarea name="situation_{{ block_index }}" rows="2" class="w-full border p-2 rounded mt-1" placeholder="이 블록의 상황을 입력하세요."></textarea>
        
        <label class="block text-sm font-semibold text-gray-600">절정</label>
        <textarea name="climax_{{ block_index }}" rows="2" class="w-full border p-2 rounded mt-1" placeholder="이 블록의 절정을 입력하세요."></textarea>
        
        <label class="block text-sm font-semibold text-gray-600">다음 블록 연결</label>
        <textarea name="next_{{ block_index }}" rows="2" class="w-full border p-2 rounded mt-1" placeholder="이 블록의 다음 블록 연결을 입력하세요."></textarea>
      </div>
    </div>
  </div>
</div>
