{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">작가 등록 (회원가입)</h2>
        <form method="post" action="{% url 'signup' %}">
            {% csrf_token %}
            <div class="space-y-4">
                <div class="space-y-5">
                    {% for field in form %}
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
                                {{ field.label }}
                            </label>
                            {{ field }}
                            
                            {% if field.help_text %}
                                <p class="mt-1 text-xs text-gray-400">{{ field.help_text|safe }}</p>
                            {% endif %}
                            
                            {% for error in field.errors %}
                                <p class="mt-1 text-xs text-red-500 font-semibold">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                </div>
            </div>
            <button type="submit" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-200">
                회원가입 완료
            </button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            이미 계정이 있으신가요? <a href="{% url 'login' %}" class="text-blue-500 hover:underline">로그인</a>
        </p>
    </div>
</div>
{% endblock %}
